<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoffradar">
<meta name="theme-color" content="#F3F4F1">
<title>Stoffradar OWL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8;
  --ink:#101418; --soft:#565D65; --mute:#848B92;
  --line:#E2E4DF; --line-2:#CFD2CC;
  --accent:#1D5C55; --accent-soft:#E2EEEB;
  --marker:#EFD35B; --band:rgba(239,211,91,.5);
  --warn:#9A3B2A; --ok:#3F6B4E;
  --r:10px; --r-s:6px;
  --sans:'Inter Tight','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101316; --surface:#171B1F; --surface-2:#1C2126;
    --ink:#EDEEEA; --soft:#AEB5BC; --mute:#7F868D;
    --line:#252A2F; --line-2:#333A40;
    --accent:#7FC9BC; --accent-soft:#16282A;
    --marker:#D9C04A; --band:rgba(217,192,74,.28);
    --warn:#D68C7B; --ok:#89BF9B;
  }
}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#171B1F; --surface-2:#1C2126;
  --ink:#EDEEEA; --soft:#AEB5BC; --mute:#7F868D;
  --line:#252A2F; --line-2:#333A40;
  --accent:#7FC9BC; --accent-soft:#16282A;
  --marker:#D9C04A; --band:rgba(217,192,74,.28);
  --warn:#D68C7B; --ok:#89BF9B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* Kopf */
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:14px;padding:13px 0}
.logo{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.015em;margin:0;white-space:nowrap}
.logo em{font-style:normal;background:linear-gradient(transparent 60%,var(--band) 60%,var(--band) 93%,transparent 93%);padding:0 2px}
.grow{flex:1}
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:8px 13px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri,html:not([data-theme]) .btn.pri{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0D1618}}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.btn.s{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--soft)}
.btn.ghost:hover{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.counts{display:flex;gap:16px;font-size:13.5px;color:var(--soft);padding-bottom:11px;flex-wrap:wrap}
.counts b{color:var(--ink);font-weight:600}

/* Zeitleiste */
.timeline{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.timeline::-webkit-scrollbar{display:none}
.tl{flex:none;background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px;color:var(--soft)}
.tl b{color:var(--ink);font-weight:600}
.tl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tl[aria-pressed="true"] b{color:#fff}

/* Ladeanzeige */
.loader{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);margin:16px 0;overflow:hidden}
.loader-head{display:flex;align-items:center;gap:12px;padding:13px 15px}
.loader-head b{font-weight:600}
.spin{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.track{height:3px;background:var(--line)}
.track div{height:100%;width:0;background:var(--accent);transition:width .3s ease}
.srclog{max-height:172px;overflow:auto;padding:4px 15px 12px;font-size:13px}
.srclog div{display:flex;gap:9px;align-items:center;padding:3px 0;color:var(--soft)}
.srclog i{font-style:normal;width:15px;text-align:center;flex:none}
.srclog .done{color:var(--ink)}
.srclog .fail{color:var(--warn)}
.note-line{padding:0 15px 13px;font-size:13px;color:var(--soft)}
.note-line.bad{color:var(--warn)}
.note-line ul{margin:7px 0 0;padding-left:17px}

/* Werkzeugleiste */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0 6px;position:sticky;top:0;z-index:20}
.seg{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:99px;padding:3px}
.seg button{background:none;border:none;border-radius:99px;padding:6px 13px;font-size:13.5px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.fld{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:8px 11px;min-width:0}
.breakdown{font-size:12.5px;color:var(--mute);margin:2px 0 14px}

/* Gruppen */
.group{margin:26px 0 0}
.group-head{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.group-head h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.group-head span{font-size:13px;color:var(--mute)}
.group-note{font-size:13px;color:var(--soft);margin:9px 0 2px;max-width:62ch}

/* Beitrag */
.item{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.item{grid-template-columns:1fr;gap:7px}}
.when{font-size:13px;line-height:1.35}
.when .d{font-weight:600;color:var(--accent);font-size:15px;display:block}
.when .s{color:var(--mute);display:block;margin-top:2px}
@media (max-width:640px){
  .when{display:flex;gap:8px;align-items:baseline}
  .when .d{font-size:13.5px}
  .when .s{margin-top:0}
}
.body h3{font-family:var(--serif);font-size:19px;line-height:1.3;font-weight:600;margin:0 0 6px}
.body h3 a{color:var(--ink);text-decoration:none}
.body h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.item.pick .body h3 a{background:linear-gradient(transparent 62%,var(--band) 62%,var(--band) 95%,transparent 95%)}
.item.read .body h3 a{color:var(--mute)}
.body p{color:var(--soft);font-size:14.5px;margin:0 0 9px;max-width:68ch}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:9px}
.tag{border:1px solid var(--line-2);border-radius:99px;padding:2px 9px;color:var(--soft)}
.tag.hot{border-color:var(--marker);background:var(--band);color:var(--ink)}
.tag.src{border:none;padding:2px 0;color:var(--soft);font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.notepad{width:100%;max-width:68ch;margin-top:10px;min-height:58px;resize:vertical}
.also{font-size:12.5px;color:var(--mute);margin-top:7px}
.empty{padding:50px 0;max-width:54ch;color:var(--soft)}
.empty h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0 0 8px;font-weight:600}

/* Seitenbereich */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:16px 0}
.panel h4{margin:0 0 11px;font-size:13px;font-weight:600;color:var(--soft)}
.panel + .panel{margin-top:12px}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.srcrow{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.srcrow:first-of-type{border-top:none}
.srcrow label{flex:1;font-size:14px;line-height:1.3;cursor:pointer}
.srcrow small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);margin-top:7px;flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--warn)}.dot.load{background:var(--marker)}
.x{background:none;border:none;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 5px}
.x:hover{color:var(--warn)}
.kat{font-size:11.5px;color:var(--mute);margin:13px 0 3px;font-weight:600}
#side{display:none}
#side.open{display:block}
@media (min-width:1000px){
  .cols{display:grid;grid-template-columns:1fr 310px;gap:36px;align-items:start}
  #side{display:block;position:sticky;top:78px}
  #sideToggle{display:none}
}
dialog{border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(560px,92vw)}
dialog::backdrop{background:rgba(8,12,15,.5)}
.dlg{padding:20px}
.dlg h3{font-family:var(--serif);font-size:20px;margin:0 0 6px;font-weight:600}
.dlg p{color:var(--soft);font-size:14px;margin:0 0 14px;max-width:60ch}
.dlg .fld{width:100%;margin-bottom:8px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 11px;cursor:pointer;font-size:14px;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.hint{font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <h1 class="logo">Stoff<em>radar</em></h1>
      <span class="grow"></span>
      <button class="btn pri" id="go">Quellen lesen</button>
      <button class="btn ghost" id="sideToggle">Quellen &amp; Filter</button>
      <button class="btn ghost" id="cfg">⚙</button>
    </div>
    <div class="counts" id="counts"></div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>

<div class="wrap cols">
  <main>
    <div id="loader"></div>

    <div class="tools">
      <div class="seg" id="modeSeg">
        <button data-mode="vorschlag" aria-pressed="true">Vorschläge</button>
        <button data-mode="alle" aria-pressed="false">Alles</button>
        <button data-mode="gemerkt" aria-pressed="false">Gemerkt</button>
      </div>
      <input class="fld" id="q" placeholder="Suchen" style="flex:1;max-width:220px">
      <select class="fld" id="kreis" style="width:auto"><option value="">Bielefeld und Lippe</option></select>
      <select class="fld" id="sort" style="width:auto">
        <option value="rubrik">Nach Rubrik</option>
        <option value="score">Nach Stoffpotenzial</option>
        <option value="date">Nach Eingang</option>
      </select>
      <button class="btn s ghost" id="copy">Merkliste kopieren</button>
    </div>
    <p class="breakdown" id="breakdown"></p>

    <div id="list"></div>
  </main>

  <aside id="side">
    <div class="panel">
      <h4>Ansicht</h4>
      <label class="chk"><input type="checkbox" id="hideDaily" checked> Tagesaktuelles ausblenden</label>
      <label class="chk"><input type="checkbox" id="nurTermin"> Nur Themen mit Termin</label>
      <label class="chk"><input type="checkbox" id="group" checked> Doppelmeldungen bündeln</label>
      <label class="chk"><input type="checkbox" id="hideRead"> Gelesenes ausblenden</label>
    </div>

    <div class="panel">
      <h4>Streuung im Gebiet</h4>
      <div id="streuung"></div>
    </div>

    <div class="panel">
      <h4>Themenradar</h4>
      <p class="hint" style="margin:0 0 9px">Eigene Stichwörter, ein Wort pro Zeile. Treffer stehen immer oben.</p>
      <textarea class="fld" id="radar" rows="4" style="width:100%"></textarea>
      <button class="btn s" id="saveRadar" style="margin-top:9px">Radar speichern</button>
    </div>

    <div class="panel">
      <h4>Quellen</h4>
      <div id="srclist"></div>
      <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
        <button class="btn s" id="addSrc">Quelle hinzufügen</button>
        <button class="btn s ghost" id="resetSrc">Standard</button>
      </div>
    </div>

    <div class="panel">
      <h4>Sicherung</h4>
      <div style="display:flex;gap:7px">
        <button class="btn s ghost" id="exp">Sichern</button>
        <button class="btn s ghost" id="imp">Laden</button>
      </div>
      <p class="hint" style="margin:9px 0 0">Merkliste, Notizen und Quellen liegen nur in diesem Browser.</p>
    </div>
  </aside>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ==========================================================================
   Stoffradar OWL — sucht Themen mit Vorlauf, nicht die Meldung des Tages.
   Läuft vollständig lokal; Feeds kommen über öffentliche Weiterleitungen.
   ========================================================================== */

const GN = q => 'https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=de&gl=DE&ceid=DE%3Ade';

/* --- Quellen ------------------------------------------------------------

/* --- Wann wird daraus ein Dreh? -----------------------------------------
   Sucht ein künftiges Datum im Text; das entscheidet über die Einordnung. */
const MONATE={januar:0,februar:1,'märz':2,maerz:2,april:3,mai:4,juni:5,juli:6,august:7,september:8,oktober:9,november:10,dezember:11};
const JAHRESZEIT={'frühjahr':2,fruehjahr:2,'frühling':2,sommer:6,herbst:9,winter:0,advent:11,weihnachten:11,ostern:3,karneval:1};

function parseWhen(text, ref){
  const t=(text||'').toLowerCase(), jetzt=ref?new Date(ref):new Date(), J=jetzt.getFullYear();
  const mk=(y,m,d,lab,prec)=>({ts:new Date(y,m,d||1,12).getTime(), label:lab, prec});

  let m=t.match(/\b(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4})\b/);
  if(m) return mk(+m[3],+m[2]-1,+m[1], +m[1]+'.'+ +m[2]+'.'+m[3],'tag');

  m=t.match(/\b(\d{1,2})\.\s*(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember)\s*(\d{4})?/);
  if(m){
    const mon=MONATE[m[2]]; let y=m[3]?+m[3]:J;
    if(!m[3] && new Date(y,mon,+m[1],12) < jetzt.getTime()-2*864e5) y=J+1;
    return mk(y,mon,+m[1], +m[1]+'. '+m[2][0].toUpperCase()+m[2].slice(1,3)+'.','tag');
  }
  m=t.match(/\b(ab|im|bis|zum|ende|anfang|mitte)\s+(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember)\s*(\d{4})?/);
  if(m){
    const mon=MONATE[m[2]]; let y=m[3]?+m[3]:J;
    if(!m[3] && mon<jetzt.getMonth()) y=J+1;
    return mk(y,mon,15, m[1]+' '+m[2][0].toUpperCase()+m[2].slice(1),'monat');
  }
  m=t.match(/\b(im|ab|bis|zum|ende|anfang|mitte)?\s*(frühjahr|fruehjahr|frühling|sommer|herbst|winter|advent|weihnachten|ostern|karneval)\b\s*(\d{4})?/);
  if(m && (m[1]||m[3])){
    const mon=JAHRESZEIT[m[2]]; let y=m[3]?+m[3]:J;
    if(!m[3] && mon<jetzt.getMonth()) y=J+1;
    return mk(y,mon,15, m[2][0].toUpperCase()+m[2].slice(1)+' '+y,'monat');
  }
  m=t.match(/\b(20[2-4]\d)\b/g);
  if(m){
    const jahre=m.map(Number).filter(y=>y>=J && y<=J+15);
    if(jahre.length){ const y=Math.min(...jahre); if(y>J || /\b(bis|ab|für|im jahr)\s+20/.test(t)) return mk(y,5,15,String(y),'jahr'); }
  }
  if(/\b(nächste[sn]?\s+jahr|kommende[sn]?\s+jahr)\b/.test(t)) return mk(J+1,5,15,'nächstes Jahr','jahr');
  if(/\b(nächste[nr]?\s+woche|kommende[nr]?\s+woche)\b/.test(t)) return {ts:Date.now()+7*864e5,label:'nächste Woche',prec:'monat'};
  if(/\bwintersemester\b/.test(t)) return mk(jetzt.getMonth()>8?J+1:J,9,1,'Wintersemester','monat');
  if(/\bsommersemester\b/.test(t)) return mk(jetzt.getMonth()>3?J+1:J,3,1,'Sommersemester','monat');
  return null;
}

async function grab(url, ms=9000, maxTries=5){
  let last;
  const reihe = S.cache.pi!=null ? [S.cache.pi,...PROXIES.keys()].filter((v,i,a)=>a.indexOf(v)===i) : [...PROXIES.keys()];
  for(const i of reihe.slice(0,maxTries)){
    const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
    try{
      const r=await fetch(PROXIES[i](url),{signal:c.signal,redirect:'follow'});
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt=await r.text();
      if(txt && txt.length>120){ if(i>0) S.cache.pi=i; return txt; }
      throw new Error('leere Antwort');
    }catch(e){ clearTimeout(t); last=e; }
  }
  throw last||new Error('nicht erreichbar');
}

const PFADE=['/feed','/rss.xml','/feed.xml','/?feed=rss2'];

const abs=(b,h)=>{ try{ return new URL(h,b).href; }catch(e){ return null; } };
const clean=s=>{ if(!s) return ''; const d=document.createElement('div'); d.innerHTML=s; return (d.textContent||'').replace(/\s+/g,' ').trim(); };
const tx=(n,sel)=>{ const e=n.querySelector(sel); return e?(e.textContent||'').trim():''; };

function parseFeed(xmlText){
  const doc=new DOMParser().parseFromString(xmlText.replace(/^\uFEFF/,''),'text/xml');
  if(doc.querySelector('parsererror')) return [];
  const nodes=[...doc.querySelectorAll('item'), ...doc.querySelectorAll('entry')], out=[];
  for(const n of nodes){
    let title=clean(tx(n,'title')); if(!title) continue;
    let link=''; const lk=n.querySelector('link');
    if(lk) link=(lk.getAttribute('href')||lk.textContent||'').trim();
    if(!link) link=tx(n,'guid');
    let desc=clean(tx(n,'description')||tx(n,'summary')||tx(n,'content'));
    let ts=Date.parse(tx(n,'pubDate')||tx(n,'published')||tx(n,'updated')||tx(n,'date')||''); if(isNaN(ts)) ts=0;
    let outlet='';
    const m=title.match(/\s[-–—]\s([^-–—]{2,42})$/);
    if(m && /news\.google/.test(link)){ outlet=m[1].trim(); title=title.slice(0,m.index).trim(); }
    if(!outlet) outlet=clean(tx(n,'source'));
    if(desc) desc=desc.replace(/\s*(Vollständige Berichterstattung|View Full Coverage).*$/i,'');
    out.push({title,link,desc:desc.slice(0,360),ts,outlet});
  }
  return out;
}

function readMarkdown(md, base){
  const raus=/^(mehr|weiterlesen|startseite|kontakt|impressum|datenschutz|suche|anmelden|login|newsletter|zur startseite|alle anzeigen|nach oben|cookie|barrierefreiheit|sitemap|inhalt|menü)$/i;
  const out=[], seen=new Set();
  const re=/\[([^\]\n]{24,170})\]\((https?:\/\/[^\s)]+)\)/g;
  let m;
  while((m=re.exec(md))){
    const t=m[1].replace(/[*_`#]/g,'').replace(/\s+/g,' ').trim();
    if(t.length<24||raus.test(t)||!/[a-zäöüß]/i.test(t)) continue;
    if(/^!/.test(m[1])) continue;
    const k=t.toLowerCase().slice(0,60); if(seen.has(k)) continue; seen.add(k);
    out.push({title:t, link:m[2], desc:'', ts:0, outlet:''});
    if(out.length>=30) break;
  }
  if(out.length<4){
    // Überschriften als Rückfallebene
    const zeilen=md.split('\n');
    zeilen.forEach((z,i)=>{
      const h=z.match(/^#{2,4}\s+(.{20,160})$/);
      if(h){
        const t=h[1].replace(/[*_`]/g,'').trim();
        const k=t.toLowerCase().slice(0,60); if(seen.has(k)) return; seen.add(k);
        const naechste=(zeilen[i+1]||'')+' '+(zeilen[i+2]||'');
        out.push({title:t, link:base, desc:naechste.replace(/[#*_`]/g,'').trim().slice(0,260), ts:0, outlet:''});
      }
    });
  }
  return out;
}

/* Kein Feed? Dann die Artikelliste der Seite erkennen.

const NAVWORTE=/^(mehr|weiterlesen|weitere|startseite|kontakt|impressum|datenschutz|barrierefreiheit|sitemap|suche|anmelden|login|logout|newsletter|zur startseite|alle anzeigen|nach oben|cookie|menü|hauptmenü|english|leichte sprache|gebärdensprache|feedback|stellenangebote|alle pressemitteilungen|archiv)$/i;
const DATUM=/(\d{1,2})\.(\d{1,2})\.(\d{4})|(\d{1,2})\.\s*(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s*(\d{4})/;

function pfadTeile(u){ try{ return new URL(u).pathname.replace(/\/+$/,'').split('/').filter(Boolean); }catch(e){ return []; } }
function slugWert(u){
  const t=pfadTeile(u); if(!t.length) return 0;
  const letzt=t[t.length-1];
  const striche=(letzt.match(/-/g)||[]).length;
  return striche>=3 ? 3 : striche>=2 ? 2 : 0;
}
function datumAus(text){
  const m=(text||'').match(DATUM); if(!m) return 0;
  let ts;
  if(m[1]) ts=new Date(+m[3], +m[2]-1, +m[1], 12).getTime();
  else {
    const MON={januar:0,februar:1,'märz':2,april:3,mai:4,juni:5,juli:6,august:7,september:8,oktober:9,november:10,dezember:11};
    ts=new Date(+m[6], MON[m[5].toLowerCase()], +m[4], 12).getTime();
  }
  return isNaN(ts)?0:ts;
}

function readHeadlines(html, base){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,form,select').forEach(e=>e.remove());
  let host='', basisPfad=[];
  try{ const u=new URL(base); host=u.host; basisPfad=u.pathname.replace(/\/+$/,'').split('/').filter(Boolean); }catch(e){}

  // 1. Kandidaten sammeln, nach Adresse zusammenfassen
  const proHref=new Map();
  for(const a of doc.querySelectorAll('a[href]')){
    const roh=a.getAttribute('href'); if(!roh||/^(#|javascript:|mailto:|tel:)/i.test(roh)) continue;
    let href; try{ href=new URL(roh, base); }catch(e){ continue; }
    if(href.host!==host) continue;
    href.hash=''; const key=href.href;
    const t=(a.textContent||'').replace(/\s+/g,' ').trim();
    const inUeberschrift=!!a.closest('h1,h2,h3,h4');
    const eintrag=proHref.get(key)||{href:key, titel:'', ueberschrift:false, knoten:a};
    if(t.length>eintrag.titel.length && !NAVWORTE.test(t)){ eintrag.titel=t; eintrag.knoten=a; }
    eintrag.ueberschrift=eintrag.ueberschrift||inUeberschrift;
    proHref.set(key, eintrag);
  }

  // 2. Gruppen bilden: gleiche Adress-Ebene = vermutlich dieselbe Rubrik
  const gruppen=new Map();
  for(const e of proHref.values()){
    if(!e.titel||e.titel.length<18||NAVWORTE.test(e.titel)) continue;
    const t=pfadTeile(e.href); if(t.length<1) continue;
    const ebene=t.slice(0,-1).join('/');
    e.tiefe=t.length; e.slug=slugWert(e.href);
    e.unterBasis = basisPfad.length>0 && t.length>basisPfad.length && basisPfad.every((x,i)=>t[i]===x);
    if(!gruppen.has(ebene)) gruppen.set(ebene,[]);
    gruppen.get(ebene).push(e);
  }

  // 3. beste Gruppe wählen
  let beste=null, bestW=0;
  for(const [ebene,liste] of gruppen){
    if(liste.length<3) continue;
    const mitSlug=liste.filter(e=>e.slug>=2).length;
    const mitUeber=liste.filter(e=>e.ueberschrift).length;
    const unter=liste.filter(e=>e.unterBasis).length;
    const w = mitSlug*3 + mitUeber*3 + unter*4 + Math.min(liste.length,12);
    if(w>bestW){ bestW=w; beste=liste; }
  }
  if(!beste) return [];

  // 4. Umfeld auswerten: Datum und Teasertext
  const out=[], gesehen=new Set();
  for(const e of beste.slice(0,30)){
    if(gesehen.has(e.href)) continue; gesehen.add(e.href);
    let box=e.knoten, umfeld='';
    for(let i=0;i<4 && box;i++){
      box=box.parentElement;
      if(!box) break;
      const t=(box.textContent||'').replace(/\s+/g,' ').trim();
      if(t.length>e.titel.length+50){ umfeld=t; break; }
    }
    const ts=datumAus(umfeld)||datumAus(e.titel);
    let desc=umfeld.replace(e.titel,' ').replace(DATUM,' ').replace(/\s+/g,' ').trim();
    desc=desc.replace(/^(Mehr|Weiterlesen|Foto:?)\s*/i,'').slice(0,340);
    out.push({title:e.titel, link:e.href, desc, ts, outlet:''});
  }
  out.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return out;
}

async function leseQuelle(src){
  if(src.kind==='feed') return parseFeed(await grab(src.url));

  // gemerkte Fundstelle zuerst
  const cf=S.cache['f:'+src.id], cp=S.cache['p:'+src.id];
  if(cf){ try{ const it=parseFeed(await grab(cf,7000,2)); if(it.length) return it; }catch(e){} }
  if(cp){ try{ const h=await grab(cp,8000,2); const hl=readHeadlines(h,cp); if(hl.length>=4){ src.gelesen='Überschriften'; return hl; } }catch(e){} }

  let html='';
  try{ html=await grab(src.url,9000,3); }catch(e){}

  if(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    // ausgewiesene Feeds der Seite
    const feeds=[...doc.querySelectorAll('link[rel~="alternate"]')]
      .filter(l=>/rss|atom|xml/i.test(l.getAttribute('type')||''))
      .map(l=>abs(src.url,l.getAttribute('href'))).filter(Boolean);
    for(const c of [...new Set(feeds)].slice(0,4)){
      try{ const it=parseFeed(await grab(c,7000,2)); if(it.length){ S.cache['f:'+src.id]=c; return it; } }catch(e){}
    }
    // die Seite selbst
    const hier=readHeadlines(html,src.url);
    if(hier.length>=5){ S.cache['p:'+src.id]=src.url; src.gelesen='Überschriften'; return hier; }

    // einem Presse- oder Aktuelles-Link folgen
    const muster=/presse|pressemitteil|aktuell|news|nachricht|meldung|veranstalt|termin|spielplan|ausstellung/i;
    const ziele=[...doc.querySelectorAll('a[href]')]
      .filter(a=>muster.test(a.textContent||'')||muster.test(a.getAttribute('href')||''))
      .map(a=>abs(src.url,a.getAttribute('href'))).filter(Boolean);
    let best=hier, bestUrl=src.url;
    for(const z of [...new Set(ziele)].slice(0,4)){
      if(z===src.url) continue;
      try{
        const h=await grab(z,8000,2); const hl=readHeadlines(h,z);
        if(hl.length>best.length){ best=hl; bestUrl=z; }
        if(best.length>=8) break;
      }catch(e){}
    }
    if(best.length>=4){ S.cache['p:'+src.id]=bestUrl; src.gelesen='Überschriften'; return best; }
    try{
      const md=await viaLesedienst(bestUrl);
      const hl=readMarkdown(md,bestUrl);
      if(hl.length>=4){ S.cache['p:'+src.id]=bestUrl; src.gelesen='Lesedienst'; return hl; }
    }catch(e){}
  }

  // übliche Adressen durchprobieren
  for(const pf of PFADE){
    const c=abs(src.url,pf); if(!c) continue;
    try{ const it=parseFeed(await grab(c,6000,2)); if(it.length){ S.cache['f:'+src.id]=c; return it; } }catch(e){}
  }
  for(const pf of SEITEN){
    const c=abs(src.url,pf); if(!c) continue;
    try{
      const h=await grab(c,6000,2); const hl=readHeadlines(h,c);
      if(hl.length>=4){ S.cache['p:'+src.id]=c; src.gelesen='Überschriften'; return hl; }
    }catch(e){}
  }
  // letzte Stufe: Lesedienst
  try{
    const md=await viaLesedienst(S.cache['p:'+src.id]||src.url);
    const hl=readMarkdown(md, src.url);
    if(hl.length>=4){ src.gelesen='Lesedienst'; return hl; }
  }catch(e){}
  throw new Error('weder Feed noch lesbare Seite gefunden');
}

/* --- Bewerten: Taugt das für einen Beitrag? ----------------------------- */
function bewerte(a){
  const hay=(a.title+' '+(a.desc||'')).toLowerCase();
  let s=0, beste=null, bestW=0; const tags=[];
  for(const r of RUBRIKEN){
    let hit=0;
    for(const w of r.words){ if(hay.includes(w)){ hit++; if(hit>=3) break; } }
    if(hit){
      const wert=r.w+(hit>1?6:0)+(hit>2?4:0);
      s+=Math.round(wert*0.9);
      tags.push(r.titel.split(',')[0]);
      if(wert>bestW){ bestW=wert; beste=r.id; }
    }
  }
  const tagesaktuell=TAGESAKTUELL.some(w=>hay.includes(w));
  const routine=ROUTINE.some(w=>hay.includes(w));

  // Ort im Zuständigkeitsgebiet
  let ort=findeOrt(a.title+' '+(a.desc||'')) || findeOrt(a.source||'');
  if(!ort && a.quellOrt && ORTE[a.quellOrt]) ort={ort:a.quellOrt, gebiet:ORTE[a.quellOrt].g};
  a.ort=ort?ort.ort:null; a.gebiet=ort?ort.gebiet:null;
  if(ort) s+=14;

  // Datum ist ein Bonus, keine Bedingung
  const ref=a.ts||Date.now();
  const when=parseWhen(a.title,ref) || parseWhen(a.title+' '+(a.desc||''),ref);
  a.when = (when && when.ts>Date.now()-2*864e5) ? when : null;
  if(a.when){ s+=10; tags.unshift('Termin'); }

  // Ein Mensch im Text macht den Beitrag erzählbar
  if(/\b(herr|frau|familie|ehepaar|seit \d+ jahren|ihr|sein)\b/.test(hay) && /\b(erzählt|berichtet|sagt|arbeitet|lebt|baut|sammelt|pflegt|kümmert)\b/.test(hay)) s+=8;

  if(tagesaktuell){ a.rubrik='tagesaktuell'; s-=40; }
  else if(routine && !beste){ a.rubrik='offen'; s-=18; }
  else a.rubrik = beste || 'offen';

  if((a.desc||'').length>150) s+=5;

  let radarHit=null;
  for(const w of (S.prefs.radar||[])){ const lw=w.toLowerCase().trim(); if(lw&&hay.includes(lw)){ radarHit=w; s+=40; break; } }
  if(radarHit) tags.unshift('Radar: '+radarHit);

  a.score=Math.max(0,Math.min(100,Math.round(s)));
  a.tags=[...new Set(tags)];
  a.pick=a.score>=S.prefs.schwelle && a.rubrik!=='tagesaktuell';
  return a;
}

/* --- Abrufen ------------------------------------------------------------ */
function logZeile(src){
  const z={idle:'·',load:'<span class="spin"></span>',ok:'✓',empty:'–',err:'×'}[src.status]||'·';
  const cls=src.status==='ok'?'done':src.status==='err'?'fail':'';
  const info=src.status==='err'?(src.err||'nicht erreichbar'):src.status==='ok'?(src.count+' '+(src.gelesen||'Einträge')):src.status==='load'?'wird gelesen':'';
  return '<div class="'+cls+'"><i>'+z+'</i><span style="flex:1">'+src.name+'</span><span style="color:var(--mute)">'+info+'</span></div>';
}
function zeichneLoader(aktiv, fertig, start){
  const sek=Math.round((Date.now()-start)/1000);
  document.getElementById('loader').innerHTML=
    '<div class="loader"><div class="loader-head"><span class="spin"></span>'+
    '<b>'+fertig+' von '+aktiv.length+' Quellen gelesen</b>'+
    '<span style="color:var(--mute);font-size:13px">'+ARTICLES.length+' Fundstücke · '+sek+' s</span></div>'+
    '<div class="track"><div style="width:'+Math.round(fertig/aktiv.length*100)+'%"></div></div>'+
    '<div class="srclog">'+aktiv.map(logZeile).join('')+'</div></div>';
}
function bilanz(aktiv){
  const err=aktiv.filter(s=>s.status==='err'), leer=aktiv.filter(s=>s.status==='empty');
  let html='';
  if(!ARTICLES.length){
    html='<div class="loader"><div class="note-line bad"><b>Nichts empfangen.</b> Alle Quellen blieben ohne Ergebnis. '+
      '<button class="btn s" id="diag" style="margin-left:6px">Verbindung prüfen</button></div></div>';
  }else if(err.length||leer.length){
    html='<div class="loader"><div class="note-line"><b>'+ARTICLES.length+' Fundstücke aus '+(aktiv.length-err.length-leer.length)+' Quellen.</b> '+
      (err.length?'Ohne Verbindung: '+err.map(s=>s.name).join(', ')+'. ':'')+
      (leer.length?'Ohne Einträge: '+leer.map(s=>s.name).join(', ')+'. ':'')+
      'Solche Quellen lassen sich rechts abschalten oder ersetzen. '+
      '<button class="btn s" id="diag" style="margin-left:6px">Verbindung prüfen</button></div></div>';
  }
  document.getElementById('loader').innerHTML=html;
  const d=document.getElementById('diag'); if(d) d.addEventListener('click',diagnose);
}

async function lauf(){
  if(BUSY) return; BUSY=true;
  const b=document.getElementById('go'); b.disabled=true; b.textContent='liest …';
  const aktiv=S.sources.filter(s=>s.on); ARTICLES=[];
  let fertig=0; const start=Date.now();
  aktiv.forEach(s=>{s.status='idle';s.count=0;s.gelesen=null;});
  zeichneLoader(aktiv,0,start);
  const tick=setInterval(()=>zeichneLoader(aktiv,fertig,start),500);

  const queue=[...aktiv];
  const worker=async()=>{
    while(queue.length){
      const src=queue.shift(); src.status='load';
      try{
        const items=await leseQuelle(src);
        items.forEach(it=>{ it.source=src.name; it.sourceId=src.id; it.quellOrt=src.o||null; it.id=(it.link||it.title).slice(0,220); ARTICLES.push(bewerte(it)); });
        src.count=items.length; src.status=items.length?'ok':'empty';
      }catch(e){ src.status='err'; src.err=(e&&e.message)||'Fehler'; }
      fertig++;
    }
  };
  await Promise.all([worker(),worker(),worker(),worker(),worker()]);
  clearInterval(tick);
  S.lastRun=Date.now();
  merkeErgebnis();
  b.disabled=false; b.textContent='Quellen lesen';
  BUSY=false;
  bilanz(aktiv); renderSources(); render();
}

async function diagnose(){
  const L=document.getElementById('loader');
  L.innerHTML='<div class="loader"><div class="note-line"><span class="spin"></span> Verbindung wird geprüft …</div></div>';
  const test=GN('Bielefeld'); const zeilen=[]; let any=false;
  for(let i=0;i<PROXIES.length;i++){
    if(i) await new Promise(r=>setTimeout(r,800));
    let ok=false,msg='';
    const c=new AbortController(), t=setTimeout(()=>c.abort(),9000);
    try{
      const r=await fetch(PROXIES[i](test),{signal:c.signal});
      const txt=await r.text();
      ok=r.ok && /<(item|entry)[\s>]/i.test(txt);
      msg=ok?'erreichbar':'Antwort unbrauchbar (HTTP '+r.status+')';
    }catch(e){ msg=e&&e.name==='AbortError'?'Zeitüberschreitung':(e.message||'blockiert'); }
    clearTimeout(t);
    if(ok){ any=true; S.cache.pi=i; }
    zeilen.push('<li>'+PROXY_NAMES[i]+': '+(ok?'<b>erreichbar</b>':msg)+'</li>');
  }
  const liste='<ul>'+zeilen.join('')+'</ul>';
  L.innerHTML='<div class="loader"><div class="note-line'+(any||ARTICLES.length?'':' bad')+'">'+
    (any?'<b>Verbindung steht.</b> Der nächste Durchlauf sollte klappen.'
      :ARTICLES.length?'<b>Der Abruf funktioniert grundsätzlich</b> — es liegen '+ARTICLES.length+' Fundstücke vor. Die Weiterleitungsdienste begrenzen die Anfragen pro Minute und schweigen kurz nach einem großen Durchlauf. Ein, zwei Minuten warten.'
      :'<b>Zurzeit kein Zugriff.</b> Entweder sind die Weiterleitungsdienste ausgelastet, oder die Seite darf keine fremden Adressen laden.')
    +liste+'</div></div>';
}

/* --- Auswahl und Sortierung --------------------------------------------- */
function dupKey(t){
  const w=t.toLowerCase().replace(/[^a-zäöüß0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>4);
  return w.sort((a,b)=>b.length-a.length).slice(0,4).sort().join('|');
}
function auswahl(){
  const p=S.prefs, q=(document.getElementById('q').value||'').toLowerCase().trim();
  STATS={tages:0,filter:0,gebuendelt:0};
  let arr=ARTICLES.filter(a=>{
    if(p.mode==='gemerkt') return !!S.saved[a.id];
    if(p.hideDaily && a.rubrik==='tagesaktuell' && !S.saved[a.id]){ STATS.tages++; return false; }
    if(p.mode==='vorschlag' && (a.rubrik==='offen'||a.rubrik==='tagesaktuell') && !S.saved[a.id]){ STATS.filter++; return false; }
    if(p.nurTermin && !a.when && !S.saved[a.id]){ STATS.filter++; return false; }
    if(p.hideRead && S.read[a.id] && !S.saved[a.id]){ STATS.filter++; return false; }
    if(p.monat && (!a.when || monKey(a.when.ts)!==p.monat)){ STATS.filter++; return false; }
    if(p.kreis && a.ort!==p.kreis && a.gebiet!==p.kreis){ STATS.filter++; return false; }
    if(q && !(a.title+' '+(a.desc||'')).toLowerCase().includes(q)){ STATS.filter++; return false; }
    return true;
  });
  const vor=arr.length;
  if(p.group){
    const g=new Map();
    arr.forEach(a=>{ const k=dupKey(a.title)||a.id; if(!g.has(k)) g.set(k,[]); g.get(k).push(a); });
    arr=[...g.values()].map(list=>{
      list.sort((x,y)=>(y.score-x.score)||((y.desc||'').length-(x.desc||'').length));
      const rep=list[0], eigen=rep.outlet||rep.source;
      rep.also=[...new Set(list.map(x=>x.outlet||x.source))].filter(o=>o&&o!==eigen);
      return rep;
    });
    STATS.gebuendelt=vor-arr.length;
  } else arr.forEach(a=>a.also=[]);

  arr.sort((a,b)=>{
    if(p.sort==='score') return b.score-a.score || (b.ts-a.ts);
    if(p.sort==='date') return (b.ts-a.ts) || (b.score-a.score);
    const ra=RUBRIKEN.findIndex(r=>r.id===a.rubrik), rb=RUBRIKEN.findIndex(r=>r.id===b.rubrik);
    if(ra!==rb) return (ra<0?99:ra)-(rb<0?99:rb);
    return b.score-a.score;
  });
  return arr;
}
const monKey=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth(); };
const monName=ts=>new Date(ts).toLocaleDateString('de-DE',{month:'short',year:'2-digit'});
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* --- Darstellung -------------------------------------------------------- */
function render(){
  const arr=auswahl(), p=S.prefs;
  const termine=ARTICLES.filter(a=>a.when).length, picks=ARTICLES.filter(a=>a.pick).length;
  document.getElementById('counts').innerHTML=
    '<span><b>'+ARTICLES.length+'</b> gelesen</span><span><b>'+termine+'</b> mit Termin</span>'+
    '<span><b>'+picks+'</b> markiert</span><span><b>'+Object.keys(S.saved).length+'</b> gemerkt</span>'+
    (S.lastRun?'<span>Stand '+new Date(S.lastRun).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>':'');

  // Zeitleiste
  const monate=new Map();
  ARTICLES.filter(a=>a.when).forEach(a=>{ const k=monKey(a.when.ts); if(!monate.has(k)) monate.set(k,{ts:a.when.ts,n:0}); monate.get(k).n++; });
  const tl=[...monate.entries()].sort((a,b)=>a[1].ts-b[1].ts).slice(0,14);
  document.getElementById('timeline').innerHTML = tl.length
    ? '<button class="tl" data-mon="" aria-pressed="'+(!p.monat)+'">alle Termine</button>'+
      tl.map(([k,v])=>'<button class="tl" data-mon="'+k+'" aria-pressed="'+(p.monat===k)+'">'+monName(v.ts)+' <b>'+v.n+'</b></button>').join('')
    : '';

  const teile=[];
  if(STATS.tages) teile.push(STATS.tages+' tagesaktuelle ausgeblendet');
  if(STATS.gebuendelt) teile.push(STATS.gebuendelt+' gebündelt');
  if(STATS.filter) teile.push(STATS.filter+' durch Filter');
  const bd=document.getElementById('breakdown');
  bd.textContent = ARTICLES.length&&teile.length ? 'von '+ARTICLES.length+' gelesenen Meldungen · '+teile.join(' · ') : '';

  // Streuung über das Zuständigkeitsgebiet
  const proOrt={};
  ARTICLES.forEach(a=>{ if(a.rubrik!=='tagesaktuell' && a.ort) proOrt[a.ort]=(proOrt[a.ort]||0)+1; });
  const ohne=ARTICLES.filter(a=>a.rubrik!=='tagesaktuell'&&!a.ort).length;
  const namen=Object.keys(ORTE);
  document.getElementById('streuung').innerHTML=namen.map(n=>
    '<div class="chk" style="justify-content:space-between;cursor:default"><span'+(proOrt[n]?'':' style="color:var(--mute)"')+'>'+n+'</span><b>'+(proOrt[n]||0)+'</b></div>'
  ).join('')+'<div class="chk" style="justify-content:space-between;cursor:default;color:var(--mute)"><span>ohne Ortsbezug</span><b>'+ohne+'</b></div>';
  const ks=document.getElementById('kreis');
  if(ks.options.length!==namen.length+GEBIETE.length+1){
    ks.innerHTML='<option value="">Bielefeld und Lippe</option>'+
      GEBIETE.map(g=>'<option value="'+g+'">'+g+' gesamt</option>').join('')+
      namen.map(n=>'<option value="'+n+'">'+n+'</option>').join('');
  }
  ks.value=p.kreis||'';

  const L=document.getElementById('list');
  if(!arr.length){
    L.innerHTML='<div class="empty"><h3>'+(ARTICLES.length?'Hier ist gerade nichts':'Noch nichts gelesen')+'</h3><p>'+
      (ARTICLES.length?'Auf „Alles“ umschalten, den Monatsfilter lösen oder die Suche leeren.'
       :'Oben auf „Quellen lesen“ tippen. Der erste Durchlauf dauert ein bis zwei Minuten, weil bei jeder Website erst nach einem Feed gesucht wird.')+'</p></div>';
    return;
  }
  const gruppen={};
  arr.forEach(a=>{ (gruppen[a.rubrik]=gruppen[a.rubrik]||[]).push(a); });
  const ordnung=[...RUBRIKEN.map(r=>r.id),'offen','tagesaktuell'];
  const reihe=Object.keys(gruppen).sort((a,b)=>ordnung.indexOf(a)-ordnung.indexOf(b));
  L.innerHTML=reihe.map(k=>{
    const g=RUB[k]||{titel:k,note:''};
    return '<section class="group"><div class="group-head"><h2>'+g.titel+'</h2><span>'+gruppen[k].length+'</span></div>'+
      (g.note?'<p class="group-note">'+g.note+'</p>':'')+
      gruppen[k].map(karte).join('')+'</section>';
  }).join('');
}

function karte(a){
  const sv=S.saved[a.id], rd=S.read[a.id], note=S.notes[a.id]||'';
  const wann = a.when
    ? '<span class="d">'+esc(a.when.label)+'</span><span class="s">'+restzeit(a.when.ts)+'</span>'
    : '<span class="s">'+(a.rubrik==='tagesaktuell'?'von heute':'jederzeit drehbar')+'</span>';
  return '<article class="item'+(a.pick?' pick':'')+(rd?' read':'')+'" data-id="'+esc(a.id)+'">'+
    '<div class="when">'+wann+'</div><div class="body">'+
      '<h3><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></h3>'+
      (a.desc?'<p>'+esc(a.desc)+'</p>':'')+
      '<div class="meta">'+(a.ort?'<span class="tag">'+esc(a.ort)+'</span>':'')+'<span class="tag src">'+esc(a.outlet||a.source)+'</span>'+
        (a.pick?'<span class="tag hot">Stoff '+a.score+'</span>':'')+
        a.tags.slice(0,4).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'+
      (a.also&&a.also.length?'<div class="also">Auch bei: '+esc(a.also.slice(0,4).join(', '))+'</div>':'')+
      '<div class="acts">'+
        '<button class="btn s save">'+(sv?'★ gemerkt':'☆ merken')+'</button>'+
        '<button class="btn s ghost read">'+(rd?'ungelesen':'gelesen')+'</button>'+
        '<button class="btn s ghost note">'+(note?'Notiz ändern':'Notiz')+'</button>'+
      '</div>'+
      (note?'<textarea class="fld notepad" data-note>'+esc(note)+'</textarea>':'')+
    '</div></article>';
}
function restzeit(ts){
  const d=Math.round((ts-Date.now())/864e5);
  if(d<0) return 'läuft';
  if(d===0) return 'heute';
  if(d===1) return 'morgen';
  if(d<14) return 'in '+d+' Tagen';
  if(d<70) return 'in '+Math.round(d/7)+' Wochen';
  return 'in '+Math.round(d/30)+' Monaten';
}

function renderSources(){
  const el=document.getElementById('srclist'); let html=''; let kat='';
  S.sources.forEach(s=>{
    if(s.k!==kat){ kat=s.k; html+='<div class="kat">'+esc(kat)+'</div>'; }
    const cls=s.status==='ok'?'ok':s.status==='err'?'err':s.status==='load'?'load':'';
    const info=s.status==='err'?(s.err||'nicht erreichbar'):s.status==='empty'?'keine Einträge':s.count?(s.count+' Einträge'+(s.gelesen?' ('+s.gelesen+')':'')):(s.kind==='site'?'Website':'Feed');
    html+='<div class="srcrow" data-sid="'+esc(s.id)+'"><span class="dot '+cls+'"></span>'+
      '<label><input type="checkbox" class="on" '+(s.on?'checked':'')+' style="margin-right:7px;accent-color:var(--accent)">'+esc(s.name)+
      '<small>'+esc(info)+'</small></label><button class="x del">×</button></div>';
  });
  el.innerHTML=html;
}

/* --- Bedienung ---------------------------------------------------------- */
const toast=m=>{ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); };

document.getElementById('list').addEventListener('click',e=>{
  const it=e.target.closest('.item'); if(!it) return;
  const id=it.dataset.id;
  if(e.target.closest('a')){ S.read[id]=1; save(); render(); return; }
  if(e.target.classList.contains('save')){ S.saved[id]?delete S.saved[id]:S.saved[id]=1; save(); render(); }
  if(e.target.classList.contains('read')){ S.read[id]?delete S.read[id]:S.read[id]=1; save(); render(); }
  if(e.target.classList.contains('note')){
    let ta=it.querySelector('[data-note]');
    if(!ta){ ta=document.createElement('textarea'); ta.className='fld notepad'; ta.dataset.note=''; ta.value=S.notes[id]||''; it.querySelector('.body').appendChild(ta); }
    ta.focus();
  }
});
document.getElementById('list').addEventListener('input',e=>{
  if(e.target.matches('[data-note]')){
    const id=e.target.closest('.item').dataset.id, v=e.target.value.trim();
    if(v) S.notes[id]=v; else delete S.notes[id];
    clearTimeout(window.__n); window.__n=setTimeout(save,500);
  }
});
document.getElementById('timeline').addEventListener('click',e=>{
  const b=e.target.closest('.tl'); if(!b) return;
  S.prefs.monat = b.dataset.mon || null; save(); render();
});
document.getElementById('modeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  S.prefs.mode=b.dataset.mode;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  save(); render();
});
document.getElementById('q').addEventListener('input',()=>{ clearTimeout(window.__q); window.__q=setTimeout(render,180); });
document.getElementById('sort').addEventListener('change',e=>{ S.prefs.sort=e.target.value; save(); render(); });
document.getElementById('kreis').addEventListener('change',e=>{ S.prefs.kreis=e.target.value||null; save(); render(); });
['hideDaily','nurTermin','group','hideRead'].forEach(id=>{
  document.getElementById(id).addEventListener('change',e=>{ S.prefs[id]=e.target.checked; save(); render(); });
});
document.getElementById('saveRadar').addEventListener('click',()=>{
  S.prefs.radar=document.getElementById('radar').value.split('\n').map(w=>w.trim()).filter(Boolean);
  ARTICLES.forEach(bewerte); save(); render(); toast('Themenradar gespeichert');
});
document.getElementById('sideToggle').addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));
document.getElementById('go').addEventListener('click',lauf);

document.getElementById('srclist').addEventListener('change',e=>{
  if(e.target.classList.contains('on')){
    const id=e.target.closest('.srcrow').dataset.sid;
    S.sources.find(x=>x.id===id).on=e.target.checked; save();
  }
});
document.getElementById('srclist').addEventListener('click',e=>{
  if(e.target.classList.contains('del')){
    const id=e.target.closest('.srcrow').dataset.sid;
    S.sources=S.sources.filter(x=>x.id!==id);
    ARTICLES=ARTICLES.filter(a=>a.sourceId!==id);
    save(); renderSources(); render();
  }
});
document.getElementById('resetSrc').addEventListener('click',()=>{
  S.sources=JSON.parse(JSON.stringify(DEFAULT_SOURCES)); S.cache={}; save(); renderSources(); toast('Standardquellen wiederhergestellt');
});

const dlg=document.getElementById('dlg'), dlgBody=document.getElementById('dlgBody');
document.getElementById('addSrc').addEventListener('click',()=>{
  dlgBody.innerHTML=`<h3>Quelle hinzufügen</h3>
   <div class="tabs"><button aria-selected="true" data-tab="web">Website</button><button aria-selected="false" data-tab="topic">Thema beobachten</button></div>
   <div data-pane="web"><p>Adresse einfügen. Gibt es einen Feed, wird er gefunden; sonst werden die Überschriften der Seite gelesen.</p>
     <input class="fld" id="nsUrl" placeholder="https://www.verein-beispiel.de">
     <input class="fld" id="nsName" placeholder="Name (optional)">
     <input class="fld" id="nsKat" placeholder="Gruppe, z. B. Kultur und Bühne (optional)"></div>
   <div data-pane="topic" hidden><p>Ein Stichwort, das laufend verfolgt wird — gut für ein Vorhaben, eine Person oder einen Ort.</p>
     <input class="fld" id="nsTopic" placeholder="z. B. Kunsthalle Umbau"></div>
   <div class="foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn pri" id="nsAdd">Hinzufügen</button></div>`;
  dlg.showModal();
});
dlgBody.addEventListener('click',async e=>{
  if(e.target.matches('[data-close]')) dlg.close();
  if(e.target.dataset.tab){
    dlgBody.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b===e.target));
    dlgBody.querySelectorAll('[data-pane]').forEach(p=>p.hidden=p.dataset.pane!==e.target.dataset.tab);
  }
  if(e.target.id==='nsAdd'){
    const tab=dlgBody.querySelector('.tabs button[aria-selected="true"]').dataset.tab;
    let src;
    if(tab==='topic'){
      const q=dlgBody.querySelector('#nsTopic').value.trim(); if(!q) return;
      src={id:'t'+Date.now(), k:'Eigene Quellen', name:q, kind:'feed', url:GN(q+' when:30d'), on:true};
    }else{
      let u=dlgBody.querySelector('#nsUrl').value.trim(); if(!u) return;
      if(!/^https?:\/\//i.test(u)) u='https://'+u;
      const name=dlgBody.querySelector('#nsName').value.trim()||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
      const kat=dlgBody.querySelector('#nsKat').value.trim()||'Eigene Quellen';
      const feed=/(\.xml|\/feed\/?$|\/rss\/?$|rss=|feed=)/i.test(u);
      src={id:'s'+Date.now(), k:kat, name, kind:feed?'feed':'site', url:u, on:true};
    }
    S.sources.push(src); save(); renderSources(); dlg.close(); toast('Quelle hinzugefügt, wird gelesen');
    src.status='load'; renderSources();
    try{
      const items=await leseQuelle(src);
      items.forEach(it=>{ it.source=src.name; it.sourceId=src.id; it.quellOrt=src.o||null; it.id=(it.link||it.title).slice(0,220); ARTICLES.push(bewerte(it)); });
      src.count=items.length; src.status=items.length?'ok':'empty';
    }catch(err){ src.status='err'; src.err=err.message; }
    save(); renderSources(); render();
  }
});

document.getElementById('cfg').addEventListener('click',()=>{
  dlgBody.innerHTML=`<h3>Einstellungen</h3>
    <p>Ab welchem Wert ein Fundstück als Stoff markiert wird. Niedriger heißt großzügiger.</p>
    <label class="chk" style="gap:14px">Schwelle <input type="range" min="15" max="70" value="${S.prefs.schwelle}" id="thr" style="flex:1"> <b id="thrV">${S.prefs.schwelle}</b></label>
    <p class="hint" style="margin-top:14px">Einsortiert wird nach dem, was die Lokalzeit sendet: Menschen und Ehrenamt, Schule und Kita, Geschichte und Erinnern, Tiere und Natur, Handwerk und Brauch, lokaler Ärger, Mitmachbares, Forschung zum Anfassen, Alltag. Ein Datum ist nur ein Bonus, keine Bedingung. Unfälle und Spielberichte landen unter Tagesaktuelles und sind ausgeblendet.</p>
    <div class="foot"><button class="btn pri" data-close>Fertig</button></div>`;
  dlgBody.querySelector('#thr').addEventListener('input',e=>{
    S.prefs.schwelle=+e.target.value; dlgBody.querySelector('#thrV').textContent=e.target.value;
    ARTICLES.forEach(bewerte); save(); render();
  });
  dlg.showModal();
});

document.getElementById('copy').addEventListener('click',async()=>{
  const ids=Object.keys(S.saved), arr=ARTICLES.filter(a=>ids.includes(a.id));
  if(!arr.length){ toast('Merkliste ist leer'); return; }
  const md=arr.map(a=>'## '+a.title+'\n'+(a.when?'Termin: '+a.when.label+'\n':'')+(a.outlet||a.source)+'\n'+a.link+
    (a.desc?'\n\n'+a.desc:'')+(S.notes[a.id]?'\n\nNotiz: '+S.notes[a.id]:'')).join('\n\n---\n\n');
  try{ await navigator.clipboard.writeText(md); toast(arr.length+' Einträge kopiert'); }
  catch(e){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download='merkliste.md'; a.click(); }
});
document.getElementById('exp').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,letzte:null},null,2)],{type:'application/json'}));
  a.download='stoffradar-sicherung.json'; a.click();
});
document.getElementById('imp').addEventListener('click',()=>document.getElementById('file').click());
document.getElementById('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); S={...S,...d,prefs:{...S.prefs,...(d.prefs||{})}};
    S.sources.forEach(s=>{s.status='idle';s.count=0}); save(); start(true); toast('Einstellungen geladen'); }
  catch(err){ toast('Datei nicht lesbar'); }
});

/* --- Start -------------------------------------------------------------- */
function start(neu){
  document.getElementById('radar').value=(S.prefs.radar||[]).join('\n');
  document.getElementById('sort').value=S.prefs.sort;
  ['hideDaily','nurTermin','group','hideRead'].forEach(id=>document.getElementById(id).checked=!!S.prefs[id]);
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===S.prefs.mode));
  renderSources();

  // letzten Stand sofort zeigen, damit die Seite nie leer startet
  if(!neu && S.letzte && Array.isArray(S.letzte.items) && S.letzte.items.length){
    ARTICLES=S.letzte.items.map(bewerte);
    S.lastRun=S.letzte.zeit;
    document.getElementById('loader').innerHTML=
      '<div class="loader"><div class="note-line">Stand von '+new Date(S.letzte.zeit).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+
      '. <button class="btn s" id="jetzt" style="margin-left:6px">Jetzt neu lesen</button></div></div>';
    const j=document.getElementById('jetzt'); if(j) j.addEventListener('click',lauf);
  }
  render();
}
load(); start(false);
